[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptgym"
version = "4.0.0"
description = "Local training gym for AI red-teamers: extract guarded secrets from defended LLM bots at minimum token cost. 16 defense tiers, transfer drills, concealment judging."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AbsoluteMenace" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "ctf", "ai-safety", "training"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Education",
]

[project.optional-dependencies]
tokens = ["tiktoken"]
vision = ["pillow"]
dev = ["pytest", "ruff"]

[project.scripts]
promptgym = "promptgym.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptgym = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
